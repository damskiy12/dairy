<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Obsidian" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>OBSIDIAN — Дневник и Планнер</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --surface: #14141c;
      --surface-2: #1d1d28;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #8b8d9b;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.22);
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --safe-top: env(safe-area-inset-top, 16px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    html.light {
      --bg: #f4f5f8;
      --surface: #ffffff;
      --surface-2: #ebedf2;
      --border: rgba(0, 0, 0, 0.08);
      --text: #111827;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(84px + var(--safe-bottom));
      transition: background 0.2s ease, color 0.2s ease;
    }

    .app-container {
      max-width: 520px;
      margin: 0 auto;
      padding: calc(12px + var(--safe-top)) 16px 24px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .header-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s;
    }
    .icon-btn:active {
      transform: scale(0.93);
    }

    /* Week Strip */
    .week-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .day-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }
    .day-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .day-name {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      display: block;
    }
    .day-pill.active .day-name {
      color: rgba(255, 255, 255, 0.85);
    }
    .day-num {
      font-size: 15px;
      font-weight: 700;
      margin-top: 2px;
      display: block;
    }
    .day-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      margin: 4px auto 0;
    }
    .day-pill.active .day-dot {
      background: #fff;
    }

    /* Segmented Control */
    .segmented {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .seg-btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .seg-btn.active {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    /* Quick Input Bar */
    .quick-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
    }
    .input:focus {
      border-color: var(--accent);
    }
    .time-input {
      width: 96px;
      flex: none;
      text-align: center;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .prio-btn {
      width: 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 16px;
      cursor: pointer;
    }
    .prio-btn.high {
      border-color: var(--warning);
      background: rgba(245, 158, 11, 0.15);
    }

    /* Progress Bar */
    .progress-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .progress-track {
      flex: 1;
      height: 6px;
      background: var(--surface-2);
      border-radius: 99px;
      margin-left: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    /* Cards & Lists */
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: opacity 0.2s;
    }
    .item-card.done {
      opacity: 0.5;
    }
    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      color: transparent;
      font-size: 13px;
      font-weight: 800;
    }
    .item-card.done .check-circle {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .item-body {
      flex: 1;
      min-width: 0;
    }
    .item-title {
      font-size: 15px;
      font-weight: 500;
      word-break: break-word;
    }
    .item-card.done .item-title {
      text-decoration: line-through;
    }
    .badge-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 4px 8px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .badge-prio {
      font-size: 11px;
      color: var(--warning);
      margin-left: 6px;
    }
    .del-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      padding: 4px 6px;
      cursor: pointer;
    }

    /* Notes */
    .tags-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .tags-row::-webkit-scrollbar { display: none; }
    .tag-pill {
      padding: 6px 12px;
      border-radius: 99px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }
    .tag-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      cursor: pointer;
      position: relative;
    }
    .note-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .note-title {
      font-size: 16px;
      font-weight: 700;
    }
    .note-preview {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-wrap;
    }
    .note-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Habits & Counters */
    .section-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin: 18px 0 10px;
    }
    .habit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .habit-dots {
      display: flex;
      gap: 5px;
      margin-top: 6px;
    }
    .h-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--surface-2);
    }
    .h-dot.on {
      background: var(--accent);
    }
    .habit-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    .habit-btn.done {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .counters-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .counter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }
    .counter-val {
      font-size: 22px;
      font-weight: 800;
      margin: 6px 0;
    }
    .counter-Controls {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .c-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 28, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      padding: 8px 16px calc(8px + var(--safe-bottom));
      z-index: 50;
    }
    html.light .bottom-nav {
      background: rgba(255, 255, 255, 0.88);
    }
    .nav-inner {
      max-width: 520px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn.active {
      color: var(--accent);
    }
    .nav-icon {
      font-size: 20px;
    }

    /* Floating Action Button for Notes */
    .fab {
      position: fixed;
      right: 20px;
      bottom: calc(82px + var(--safe-bottom));
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 28px;
      box-shadow: 0 8px 24px var(--accent-glow);
      cursor: pointer;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
    }

    /* Fullscreen Modal (Note Editor & Settings) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-sheet {
      width: 100%;
      max-width: 520px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 18px 16px calc(24px + var(--safe-bottom));
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .editor-title {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 22px;
      font-weight: 800;
      outline: none;
      width: 100%;
    }
    .editor-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.55;
      padding: 14px;
      min-height: 280px;
      resize: none;
      outline: none;
      flex: 1;
    }
    .color-row {
      display: flex;
      gap: 12px;
      margin: 8px 0 14px;
    }
    .color-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
    }
    .color-dot.active {
      border-color: var(--text);
    }
    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .view-section { display: none; }
    .view-section.active { display: block; }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="header">
      <div>
        <div class="header-title" id="headerTitle">Сегодня</div>
        <div class="header-subtitle" id="headerDate"></div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" title="Сменить тему">🌙</button>
        <button class="icon-btn" id="settingsBtn" title="Настройки и Бэкап">⚙️</button>
      </div>
    </header>

    <!-- TAB 1: TODAY -->
    <section id="view-today" class="view-section active">
      <div class="week-strip" id="weekStrip"></div>

      <div class="segmented">
        <button class="seg-btn active" id="modeTasksBtn" onclick="setTodayMode('tasks')">Задачи</button>
        <button class="seg-btn" id="modeScheduleBtn" onclick="setTodayMode('schedule')">По часам</button>
      </div>

      <!-- Tasks Mode -->
      <div id="tasksBlock">
        <div class="quick-bar">
          <input type="text" id="taskInput" class="input" placeholder="Добавить задачу на день..." onkeydown="if(event.key==='Enter') addTask()" />
          <button class="prio-btn" id="prioToggle" onclick="togglePrio()" title="Важность">⚡</button>
          <button class="btn-primary" onclick="addTask()">+</button>
        </div>
        <div class="progress-wrap">
          <span id="taskStatsText">Выполнено 0 из 0</span>
          <div class="progress-track"><div class="progress-fill" id="taskProgressFill" style="width:0%"></div></div>
        </div>
        <div class="list" id="tasksList"></div>
      </div>

      <!-- Schedule Mode -->
      <div id="scheduleBlock" style="display:none">
        <div class="quick-bar">
          <input type="time" id="schedTime" class="input time-input" value="10:00" />
          <input type="text" id="schedInput" class="input" placeholder="Событие или пара..." onkeydown="if(event.key==='Enter') addSchedule()" />
          <button class="btn-primary" onclick="addSchedule()">+</button>
        </div>
        <div class="list" id="scheduleList"></div>
      </div>
    </section>

    <!-- TAB 2: NOTES -->
    <section id="view-notes" class="view-section">
      <div class="segmented">
        <button class="seg-btn active" id="noteScopeQuick" onclick="setNoteScope('quick')">⚡ Быстрые / Дневник</button>
        <button class="seg-btn" id="noteScopeLong" onclick="setNoteScope('long')">📚 Долгосрочные</button>
      </div>

      <div class="quick-bar" id="quickThoughtBar">
        <input type="text" id="quickNoteInput" class="input" placeholder="Быстрая мысль или итог дня..." onkeydown="if(event.key==='Enter') addQuickNote()" />
        <button class="btn-primary" onclick="addQuickNote()">↑</button>
      </div>

      <div class="quick-bar" style="margin-bottom:10px">
        <input type="text" id="noteSearch" class="input" placeholder="🔍 Поиск по заметкам..." oninput="renderNotes()" />
      </div>

      <div class="tags-row" id="tagsFilterRow"></div>
      <div class="list" id="notesList"></div>
    </section>

    <!-- TAB 3: TRACKERS -->
    <section id="view-trackers" class="view-section">
      <div class="section-label" style="margin-top:0">Привычки на сегодня</div>
      <div class="list" id="habitsList"></div>
      <div class="quick-bar" style="margin-top:12px">
        <input type="text" id="habitInput" class="input" placeholder="Новая привычка (напр. Спорт, Чтение)..." onkeydown="if(event.key==='Enter') addHabit()" />
        <button class="btn-primary" onclick="addHabit()">+</button>
      </div>

      <div class="section-label">Быстрые счетчики дня</div>
      <div class="counters-grid">
        <div class="counter-card">
          <div style="font-size:13px;color:var(--text-muted)">💧 Вода (ст.)</div>
          <div class="counter-val" id="cntWater">0</div>
          <div class="counter-Controls">
            <button class="c-btn" onclick="changeCounter('water', -1)">−</button>
            <button class="c-btn" onclick="changeCounter('water', 1)">+</button>
          </div>
        </div>
        <div class="counter-card">
          <div style="font-size:13px;color:var(--text-muted)">😴 Сон (ч)</div>
          <div class="counter-val" id="cntSleep">7</div>
          <div class="counter-Controls">
            <button class="c-btn" onclick="changeCounter('sleep', -0.5)">−</button>
            <button class="c-btn" onclick="changeCounter('sleep', 0.5)">+</button>
          </div>
        </div>
        <div class="counter-card">
          <div style="font-size:13px;color:var(--text-muted)">🎯 Фокус (ч)</div>
          <div class="counter-val" id="cntFocus">0</div>
          <div class="counter-Controls">
            <button class="c-btn" onclick="changeCounter('focus', -0.5)">−</button>
            <button class="c-btn" onclick="changeCounter('focus', 0.5)">+</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Floating New Note Button -->
  <button class="fab" id="fabNote" onclick="openNoteEditor()">+</button>

  <!-- Note Editor Modal -->
  <div class="modal-backdrop" id="noteModal">
    <div class="modal-sheet">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button class="seg-btn" style="flex:none;padding:6px 12px" onclick="closeNoteEditor()">Отмена</button>
        <div style="display:flex;gap:8px">
          <button class="icon-btn" id="editorPinBtn" onclick="toggleEditorPin()" title="Закрепить">📌</button>
          <button class="icon-btn" id="editorDelBtn" onclick="deleteCurrentNote()" style="color:var(--danger);display:none">🗑</button>
          <button class="btn-primary" style="padding:8px 16px;font-size:14px" onclick="saveNoteFromEditor()">Готово</button>
        </div>
      </div>
      <input type="text" id="editorTitle" class="editor-title" placeholder="Заголовок заметки..." />
      <div style="display:flex;gap:8px;flex-wrap:wrap" id="editorTagsRow"></div>
      <textarea id="editorBody" class="editor-body" placeholder="Пиши свободно..."></textarea>
    </div>
  </div>

  <!-- Settings & Backup Modal -->
  <div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this) closeSettings()">
    <div class="modal-sheet">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong style="font-size:18px">Настройки и Бэкап</strong>
        <button class="icon-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="section-label">Акцентный цвет (Obsidian)</div>
      <div class="color-row" id="accentPicker"></div>

      <div class="section-label">Сохранность данных</div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:8px">
        Все записи хранятся в памяти устройства. Скачай файл бэкапа, чтобы перенести данные между iPhone и ноутбуком.
      </p>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" style="flex:1;padding:12px;font-size:14px" onclick="exportData()">⬇ Экспорт (.json)</button>
        <label class="btn-primary" style="flex:1;padding:12px;font-size:14px;text-align:center;background:var(--surface-2);color:var(--text)">
          ⬆ Импорт (.json)
          <input type="file" accept=".json" style="display:none" onchange="importData(event)" />
        </label>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-inner">
      <button class="nav-btn active" id="nav-today" onclick="switchTab('today')">
        <span class="nav-icon">📅</span>
        <span>Сегодня</span>
      </button>
      <button class="nav-btn" id="nav-notes" onclick="switchTab('notes')">
        <span class="nav-icon">📝</span>
        <span>Заметки</span>
      </button>
      <button class="nav-btn" id="nav-trackers" onclick="switchTab('trackers')">
        <span class="nav-icon">🔥</span>
        <span>Трекеры</span>
      </button>
    </div>
  </nav>

  <script>
    const STORAGE_KEY = 'obsidian_flow_v1';
    const TAGS = ['#важное', '#идеи', '#дневник', '#проект', '#учеба'];
    const ACCENTS = [
      { name: 'Violet', color: '#8b5cf6', glow: 'rgba(139,92,246,0.22)' },
      { name: 'Emerald', color: '#10b981', glow: 'rgba(16,185,129,0.22)' },
      { name: 'Blue', color: '#3b82f6', glow: 'rgba(59,130,246,0.22)' },
      { name: 'Amber', color: '#f59e0b', glow: 'rgba(245,158,11,0.22)' }
    ];

    const todayISO = () => new Date().toISOString().slice(0, 10);

    let state = {
      theme: 'dark',
      accent: '#8b5cf6',
      selectedDate: todayISO(),
      todayMode: 'tasks',
      noteScope: 'quick',
      activeTag: 'Все',
      tasks: [],
      schedule: [],
      notes: [
        {
          id: 'n1',
          title: 'Добро пожаловать в OBSIDIAN',
          body: 'Это твоя личная база заметок и распорядка дня. Долгосрочные заметки подходят для проектов, списков и учебы, а Быстрые — для мыслей и дневника.',
          scope: 'long',
          tag: '#важное',
          pinned: true,
          date: todayISO()
        }
      ],
      habits: [
        { id: 'h1', name: 'Спорт / Разминка', history: {} },
        { id: 'h2', name: 'Глубокий фокус (без соцсетей)', history: {} },
        { id: 'h3', name: 'Чтение / Учеба', history: {} }
      ],
      counters: {}
    };

    let currentPrio = 'normal';
    let editingNoteId = null;
    let editorPinned = false;
    let editorTag = '#дневник';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed };
        }
      } catch (e) { console.error(e); }
      if (!state.selectedDate) state.selectedDate = todayISO();
      applyTheme();
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function applyTheme() {
      document.documentElement.classList.toggle('light', state.theme === 'light');
      document.getElementById('themeBtn').textContent = state.theme === 'light' ? '☀️' : '🌙';
      const found = ACCENTS.find(a => a.color === state.accent) || ACCENTS[0];
      document.documentElement.style.setProperty('--accent', found.color);
      document.documentElement.style.setProperty('--accent-glow', found.glow);
    }

    document.getElementById('themeBtn').onclick = () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      saveState();
      applyTheme();
    };

    function switchTab(tab) {
      ['today', 'notes', 'trackers'].forEach(t => {
        document.getElementById('view-' + t).classList.toggle('active', t === tab);
        document.getElementById('nav-' + t).classList.toggle('active', t === tab);
      });
      const titles = { today: 'Сегодня', notes: 'Заметки', trackers: 'Трекеры' };
      document.getElementById('headerTitle').textContent = titles[tab];
      document.getElementById('fabNote').style.display = tab === 'notes' ? 'flex' : 'none';
      renderAll();
    }

    function renderWeekStrip() {
      const strip = document.getElementById('weekStrip');
      strip.innerHTML = '';
      const base = new Date();
      const dayNames = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      for (let i = -3; i <= 3; i++) {
        const d = new Date(base);
        d.setDate(base.getDate() + i);
        const iso = d.toISOString().slice(0, 10);
        const hasData = state.tasks.some(t => t.date === iso) || state.schedule.some(s => s.date === iso);
        const pill = document.createElement('div');
        pill.className = 'day-pill' + (iso === state.selectedDate ? ' active' : '');
        pill.innerHTML = `
          <span class="day-name">${dayNames[d.getDay()]}</span>
          <span class="day-num">${d.getDate()}</span>
          ${hasData ? '<div class="day-dot"></div>' : '<div style="height:8px"></div>'}
        `;
        pill.onclick = () => { state.selectedDate = iso; saveState(); renderAll(); };
        strip.appendChild(pill);
      }
      const selDateObj = new Date(state.selectedDate);
      document.getElementById('headerDate').textContent = selDateObj.toLocaleDateString('ru-RU', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
    }

    function setTodayMode(mode) {
      state.todayMode = mode;
      document.getElementById('modeTasksBtn').classList.toggle('active', mode === 'tasks');
      document.getElementById('modeScheduleBtn').classList.toggle('active', mode === 'schedule');
      document.getElementById('tasksBlock').style.display = mode === 'tasks' ? 'block' : 'none';
      document.getElementById('scheduleBlock').style.display = mode === 'schedule' ? 'block' : 'none';
    }

    function togglePrio() {
      currentPrio = currentPrio === 'normal' ? 'high' : 'normal';
      document.getElementById('prioToggle').classList.toggle('high', currentPrio === 'high');
    }

    function addTask() {
      const inp = document.getElementById('taskInput');
      const text = inp.value.trim();
      if (!text) return;
      state.tasks.unshift({
        id: 't_' + Date.now(),
        text,
        done: false,
        prio: currentPrio,
        date: state.selectedDate
      });
      inp.value = '';
      saveState();
      renderAll();
    }

    function toggleTask(id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) { t.done = !t.done; saveState(); renderAll(); }
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(x => x.id !== id);
      saveState();
      renderAll();
    }

    function addSchedule() {
      const time = document.getElementById('schedTime').value || '12:00';
      const inp = document.getElementById('schedInput');
      const text = inp.value.trim();
      if (!text) return;
      state.schedule.push({
        id: 's_' + Date.now(),
        time,
        text,
        done: false,
        date: state.selectedDate
      });
      state.schedule.sort((a, b) => a.time.localeCompare(b.time));
      inp.value = '';
      saveState();
      renderAll();
    }

    function toggleSched(id) {
      const s = state.schedule.find(x => x.id === id);
      if (s) { s.done = !s.done; saveState(); renderAll(); }
    }

    function deleteSched(id) {
      state.schedule = state.schedule.filter(x => x.id !== id);
      saveState();
      renderAll();
    }

    function renderToday() {
      const dayTasks = state.tasks.filter(t => t.date === state.selectedDate);
      const doneCount = dayTasks.filter(t => t.done).length;
      document.getElementById('taskStatsText').textContent = `Выполнено ${doneCount} из ${dayTasks.length}`;
      const pct = dayTasks.length ? Math.round((doneCount / dayTasks.length) * 100) : 0;
      document.getElementById('taskProgressFill').style.width = pct + '%';

      const tList = document.getElementById('tasksList');
      tList.innerHTML = dayTasks.length ? '' : '<div class="empty-state">На этот день задач пока нет</div>';
      dayTasks.forEach(t => {
        const div = document.createElement('div');
        div.className = 'item-card' + (t.done ? ' done' : '');
        div.innerHTML = `
          <div class="check-circle" onclick="toggleTask('${t.id}')">✓</div>
          <div class="item-body" onclick="toggleTask('${t.id}')">
            <span class="item-title">${escapeHtml(t.text)}</span>
            ${t.prio === 'high' ? '<span class="badge-prio">⚡ Важно</span>' : ''}
          </div>
          <button class="del-btn" onclick="deleteTask('${t.id}')">✕</button>
        `;
        tList.appendChild(div);
      });

      const daySched = state.schedule.filter(s => s.date === state.selectedDate);
      const sList = document.getElementById('scheduleList');
      sList.innerHTML = daySched.length ? '' : '<div class="empty-state">Расписание по часам пусто</div>';
      daySched.forEach(s => {
        const div = document.createElement('div');
        div.className = 'item-card' + (s.done ? ' done' : '');
        div.innerHTML = `
          <span class="badge-time">${s.time}</span>
          <div class="item-body" onclick="toggleSched('${s.id}')">
            <span class="item-title">${escapeHtml(s.text)}</span>
          </div>
          <button class="del-btn" onclick="deleteSched('${s.id}')">✕</button>
        `;
        sList.appendChild(div);
      });
    }

    /* Notes Logic */
    function setNoteScope(scope) {
      state.noteScope = scope;
      document.getElementById('noteScopeQuick').classList.toggle('active', scope === 'quick');
      document.getElementById('noteScopeLong').classList.toggle('active', scope === 'long');
      document.getElementById('quickThoughtBar').style.display = scope === 'quick' ? 'flex' : 'none';
      renderNotes();
    }

    function addQuickNote() {
      const inp = document.getElementById('quickNoteInput');
      const text = inp.value.trim();
      if (!text) return;
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      state.notes.unshift({
        id: 'n_' + Date.now(),
        title: `Запись в ${timeStr}`,
        body: text,
        scope: 'quick',
        tag: '#дневник',
        pinned: false,
        date: todayISO()
      });
      inp.value = '';
      saveState();
      renderNotes();
    }

    function renderNotes() {
      const tagRow = document.getElementById('tagsFilterRow');
      tagRow.innerHTML = '';
      ['Все', ...TAGS].forEach(tag => {
        const b = document.createElement('button');
        b.className = 'tag-pill' + (state.activeTag === tag ? ' active' : '');
        b.textContent = tag;
        b.onclick = () => { state.activeTag = tag; renderNotes(); };
        tagRow.appendChild(b);
      });

      const q = (document.getElementById('noteSearch').value || '').toLowerCase();
      const filtered = state.notes
        .filter(n => (n.scope || 'quick') === state.noteScope)
        .filter(n => state.activeTag === 'Все' || n.tag === state.activeTag)
        .filter(n => !q || (n.title + ' ' + n.body).toLowerCase().includes(q))
        .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

      const list = document.getElementById('notesList');
      list.innerHTML = filtered.length ? '' : '<div class="empty-state">Заметок в этом разделе пока нет</div>';
      filtered.forEach(n => {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.onclick = () => openNoteEditor(n.id);
        card.innerHTML = `
          <div class="note-card-header">
            <div class="note-title">${escapeHtml(n.title || 'Без названия')}</div>
            ${n.pinned ? '<span>📌</span>' : ''}
          </div>
          <div class="note-preview">${escapeHtml(n.body || '')}</div>
          <div class="note-meta">
            <span>${n.tag || '#заметка'}</span>
            <span>•</span>
            <span>${n.date || ''}</span>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function openNoteEditor(id = null) {
      editingNoteId = id;
      const existing = state.notes.find(n => n.id === id);
      document.getElementById('editorTitle').value = existing ? existing.title : '';
      document.getElementById('editorBody').value = existing ? existing.body : '';
      editorPinned = existing ? !!existing.pinned : false;
      editorTag = existing ? (existing.tag || '#дневник') : (state.noteScope === 'long' ? '#важное' : '#дневник');
      document.getElementById('editorPinBtn').style.opacity = editorPinned ? '1' : '0.4';
      document.getElementById('editorDelBtn').style.display = existing ? 'flex' : 'none';
      renderEditorTags();
      document.getElementById('noteModal').classList.add('open');
    }

    function renderEditorTags() {
      const row = document.getElementById('editorTagsRow');
      row.innerHTML = '';
      TAGS.forEach(t => {
        const b = document.createElement('button');
        b.className = 'tag-pill' + (editorTag === t ? ' active' : '');
        b.textContent = t;
        b.onclick = () => { editorTag = t; renderEditorTags(); };
        row.appendChild(b);
      });
    }

    function toggleEditorPin() {
      editorPinned = !editorPinned;
      document.getElementById('editorPinBtn').style.opacity = editorPinned ? '1' : '0.4';
    }

    function saveNoteFromEditor() {
      const title = document.getElementById('editorTitle').value.trim() || 'Заметка';
      const body = document.getElementById('editorBody').value.trim();
      if (!body && !title) { closeNoteEditor(); return; }

      if (editingNoteId) {
        const n = state.notes.find(x => x.id === editingNoteId);
        if (n) {
          n.title = title;
          n.body = body;
          n.pinned = editorPinned;
          n.tag = editorTag;
        }
      } else {
        state.notes.unshift({
          id: 'n_' + Date.now(),
          title,
          body,
          scope: state.noteScope,
          tag: editorTag,
          pinned: editorPinned,
          date: todayISO()
        });
      }
      saveState();
      closeNoteEditor();
      renderNotes();
    }

    function deleteCurrentNote() {
      if (!editingNoteId) return;
      state.notes = state.notes.filter(n => n.id !== editingNoteId);
      saveState();
      closeNoteEditor();
      renderNotes();
    }

    function closeNoteEditor() {
      document.getElementById('noteModal').classList.remove('open');
    }

    /* Trackers Logic */
    function renderTrackers() {
      const hList = document.getElementById('habitsList');
      hList.innerHTML = '';
      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        last7.push(d.toISOString().slice(0, 10));
      }
      const tIso = todayISO();

      state.habits.forEach(h => {
        const hist = h.history || {};
        let streak = 0;
        for (let i = 0; i < 30; i++) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const iso = d.toISOString().slice(0, 10);
          if (hist[iso]) streak++;
          else if (i > 0) break;
        }
        const doneToday = !!hist[tIso];
        const dotsHtml = last7.map(iso => `<div class="h-dot ${hist[iso] ? 'on' : ''}"></div>`).join('');

        const card = document.createElement('div');
        card.className = 'habit-card';
        card.innerHTML = `
          <div>
            <div style="font-weight:600;font-size:15px">${escapeHtml(h.name)} <span style="font-size:12px;color:var(--warning);margin-left:6px">🔥 ${streak} дн.</span></div>
            <div class="habit-dots">${dotsHtml}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="habit-btn ${doneToday ? 'done' : ''}" onclick="toggleHabit('${h.id}')">✓</button>
            <button class="del-btn" onclick="deleteHabit('${h.id}')">✕</button>
          </div>
        `;
        hList.appendChild(card);
      });

      const dayCounters = state.counters[tIso] || { water: 0, sleep: 7, focus: 0 };
      document.getElementById('cntWater').textContent = dayCounters.water;
      document.getElementById('cntSleep').textContent = dayCounters.sleep;
      document.getElementById('cntFocus').textContent = dayCounters.focus;
    }

    function toggleHabit(id) {
      const h = state.habits.find(x => x.id === id);
      if (!h) return;
      if (!h.history) h.history = {};
      const tIso = todayISO();
      h.history[tIso] = !h.history[tIso];
      saveState();
      renderTrackers();
    }

    function addHabit() {
      const inp = document.getElementById('habitInput');
      const name = inp.value.trim();
      if (!name) return;
      state.habits.push({ id: 'h_' + Date.now(), name, history: {} });
      inp.value = '';
      saveState();
      renderTrackers();
    }

    function deleteHabit(id) {
      state.habits = state.habits.filter(h => h.id !== id);
      saveState();
      renderTrackers();
    }

    function changeCounter(key, delta) {
      const tIso = todayISO();
      if (!state.counters[tIso]) state.counters[tIso] = { water: 0, sleep: 7, focus: 0 };
      state.counters[tIso][key] = Math.max(0, +(state.counters[tIso][key] + delta).toFixed(1));
      saveState();
      renderTrackers();
    }

    /* Settings & Backup */
    document.getElementById('settingsBtn').onclick = () => {
      const picker = document.getElementById('accentPicker');
      picker.innerHTML = '';
      ACCENTS.forEach(a => {
        const dot = document.createElement('div');
        dot.className = 'color-dot' + (state.accent === a.color ? ' active' : '');
        dot.style.background = a.color;
        dot.onclick = () => { state.accent = a.color; saveState(); applyTheme(); document.getElementById('settingsBtn').click(); };
        picker.appendChild(dot);
      });
      document.getElementById('settingsModal').classList.add('open');
    };

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `obsidian_backup_${todayISO()}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          state = { ...state, ...imported };
          saveState();
          applyTheme();
          renderAll();
          closeSettings();
        } catch (err) { alert('Ошибка чтения файла бэкапа'); }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function renderAll() {
      renderWeekStrip();
      renderToday();
      renderNotes();
      renderTrackers();
    }

    loadState();
    renderAll();
  </script>
</body>
</html>
